http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
    api-rate-limit:
      rateLimit:
        average: 60
        burst: 120
        period: 1m
    compress:
      compress: {}
    internal-deny:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
